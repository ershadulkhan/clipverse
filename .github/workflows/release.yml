name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    name: Backend typecheck
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npx wrangler deploy --dry-run --outdir /tmp/worker-build

  extension:
    name: Chrome extension
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: chrome-extension } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: chrome-extension/package-lock.json }
      - run: npm ci
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e "const f='public/manifest.json';const m=require('./'+f);m.version='${V}'.replace(/[^0-9.]/g,'');require('fs').writeFileSync(f,JSON.stringify(m,null,2)+'\n')"
      - run: npm run build
      - run: cd dist && zip -qr ../Clipverse-Chrome-Extension-MV3.zip .
      - uses: actions/upload-artifact@v4
        with: { name: chrome-extension, path: chrome-extension/Clipverse-Chrome-Extension-MV3.zip }

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android-app } }
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); Gradle downloads the
      # compile SDK it needs on first use, so no extra setup action is required.
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key (optional)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CLIPT_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          CLIPT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLIPT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CLIPT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          CLIPT_VERSION_CODE: ${{ github.run_number }}
          CLIPT_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0-dev' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk Clipverse-Android-Universal.apk
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: android-app/Clipverse-Android-Universal.apk }

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, extension, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/Clipverse-Android-Universal.apk
            artifacts/Clipverse-Chrome-Extension-MV3.zip
